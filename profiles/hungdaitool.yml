# Profile mặc định — Dự án HungDai Media
# Dùng: python3 scripts/auto_get_skills.py --profile hungdaitool
# Dùng: bash scripts/link-skills.sh --profile hungdaitool

profile:
  name: hungdaitool
  description: "HungDai Media — AI agent toolkit cho nội dung & kỹ thuật"
  owner: hungdaimedia-gif
  version: "2.0"

# Domain được kích hoạt cho dự án này
active_domains:
  - engineering
  - writing
  - art
  - finance
  - productivity
  - misc

# Bộ lọc skill — null = lấy tất cả trong domain
include_tags: []          # [] = không lọc theo tag
exclude_skills:           # Tên skill cụ thể cần loại bỏ (không link)
  - setup-matt-pocock-skills  # Internal, không liên quan

# Nguồn GitHub dành riêng cho profile này
# (Nếu không có sources riêng, dùng sources.yml toàn cục)
sources:
  - repo: "mattpocock/skills"
    branch: "main"
    domain: "engineering"
    conflict: "skip"

# Quality Gate riêng (override global nếu cần)
# null = dùng ngưỡng mặc định (70/100)
quality_threshold: 70

# Thư mục đích khi link (override link-skills.sh default)
# null = dùng mặc định: ~/.agents/skills, ~/.claude/skills
link_targets: null
