# SKILL SOURCES — Danh sách GitHub repos chứa skills cần nạp tự động
#
# Cách dùng:
#   python3 scripts/auto_get_skills.py              -- Nạp tất cả từ file này
#   python3 scripts/auto_get_skills.py --dry-run    -- Xem preview, không thay đổi gì
#   python3 scripts/auto_get_skills.py --repo mattpocock/skills  -- Chỉ 1 repo cụ thể
#
# Format mỗi entry:
#   - repo: "owner/repo-name"         (bắt buộc)
#     branch: "main"                  (tùy chọn, mặc định: main)
#     skills_dir: "skills"            (tùy chọn, thư mục chứa skills trong repo)
#     domain: "engineering"           (tùy chọn: engineering/writing/art/finance)
#     conflict: "skip"                (tùy chọn: skip | override | merge)
#     tags: ["tdd", "review"]         (tùy chọn, để tìm kiếm)

sources:
  # --- NGUỒN GỐC (Original upstream) ---
  - repo: "mattpocock/skills"
    branch: "main"
    skills_dir: "skills"
    domain: "engineering"
    conflict: "skip"
    tags: ["engineering", "tdd", "review", "original"]

  # --- ANTHROPIC OFFICIAL AGENT SKILLS (176k ⭐, 20k 🍴) ---
  - repo: "anthropics/skills"
    branch: "main"
    skills_dir: "skills"
    conflict: "skip"
    tags: ["official", "anthropic", "frontend", "art", "productivity", "office"]

  # --- SUPERPOWERS AGENTIC SKILLS FRAMEWORK (286k ⭐, 25k 🍴) ---
  - repo: "obra/superpowers"
    branch: "main"
    skills_dir: "skills"
    conflict: "skip"
    tags: ["superpowers", "agent-framework", "subagents", "worktrees", "plans"]

  # --- OWASP SECURITY CHEAT SHEET (30k ⭐, 4k 🍴) ---
  - repo: "OWASP/CheatSheetSeries"
    branch: "master"
    domain: "engineering"
    conflict: "skip"
    tags: ["security", "owasp", "auth", "jwt", "appsec"]

  # --- CREWAI MULTI-AGENT ORCHESTRATION (33k ⭐, 4.5k 🍴) ---
  - repo: "joaomdmoura/crewAI"
    branch: "main"
    domain: "engineering"
    conflict: "skip"
    tags: ["multi-agent", "crewai", "orchestration", "delegation"]

  # --- LANGGRAPH AGENT STATE MACHINE (18k ⭐, 2.5k 🍴) ---
  - repo: "langchain-ai/langgraph"
    branch: "main"
    domain: "engineering"
    conflict: "skip"
    tags: ["state-graph", "cyclical-agent", "checkpoints", "human-in-the-loop"]

  # --- DOCKER AWESOME COMPOSE & MULTI-STAGE (35k ⭐, 6.5k 🍴) ---
  - repo: "docker/awesome-compose"
    branch: "master"
    domain: "engineering"
    conflict: "skip"
    tags: ["devops", "docker", "compose", "multi-stage", "production"]

  # --- SYSTEM DESIGN PRIMER (290k ⭐, 46k 🍴) ---
  - repo: "donnemartin/system-design-primer"
    branch: "master"
    domain: "engineering"
    conflict: "skip"
    tags: ["system-design", "high-concurrency", "scaling", "caching", "architecture"]

